<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATS Resume Builder | QuickDocs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  <header class="bg-blue-600 text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="/" class="text-2xl font-bold">QuickDocs<span class="text-yellow-300">.in</span></a>
      <a href="/biodata" class="text-sm bg-blue-700 px-3 py-1 rounded hover:bg-blue-800">Switch to Biodata Maker</a>
    </div>
  </header>

  <div class="max-w-6xl mx-auto my-6 p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
      <h2 class="text-xl font-bold mb-4 text-blue-600 border-b pb-2">Enter ATS Resume Details</h2>
      <form class="space-y-3 text-sm">
        <div><label class="font-semibold">Full Name</label><input type="text" id="resName" class="w-full p-2 border rounded" oninput="updateResume()"></div>
        <div><label class="font-semibold">Target Job Title</label><input type="text" id="resTitle" class="w-full p-2 border rounded" oninput="updateResume()"></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="font-semibold">Email</label><input type="text" id="resEmail" class="w-full p-2 border rounded" oninput="updateResume()"></div>
          <div><label class="font-semibold">Phone</label><input type="text" id="resPhone" class="w-full p-2 border rounded" oninput="updateResume()"></div>
        </div>
        <div><label class="font-semibold">Key Technical & Soft Skills</label><textarea id="resSkills" class="w-full p-2 border rounded h-16" oninput="updateResume()"></textarea></div>
        <div><label class="font-semibold">Work Experience / Projects</label><textarea id="resExp" class="w-full p-2 border rounded h-20" oninput="updateResume()"></textarea></div>
      </form>
      <div class="mt-6 space-y-2">
        <button onclick="downloadResume(false)" class="w-full bg-gray-600 text-white py-2 rounded text-sm hover:bg-gray-700">Free Download (With Watermark)</button>
        <button onclick="triggerPayment()" class="w-full bg-green-600 text-white py-2 rounded font-semibold text-sm hover:bg-green-700">Unlock High-Res ATS PDF - ₹29</button>
      </div>
    </div>

    <div class="bg-gray-200 p-4 rounded flex flex-col items-center">
      <h3 class="text-xs font-bold mb-2 text-gray-500">LIVE ATS PREVIEW</h3>
      <div id="resumeTemplate" class="bg-white w-full max-w-[420px] p-6 rounded shadow border text-gray-900 text-xs leading-relaxed">
        <h1 id="pResName" class="text-xl font-bold text-center uppercase tracking-wide">YOUR NAME</h1>
        <p id="pResTitle" class="text-center font-medium text-gray-600 mb-1">Target Job Title</p>
        <p class="text-center text-[10px] text-gray-500 border-b pb-2 mb-3"><span id="pResEmail">email@example.com</span> | <span id="pResPhone">+91 9876543210</span></p>

        <div class="mb-3">
          <h2 class="font-bold border-b border-gray-400 mb-1 text-gray-800 uppercase">Skills</h2>
          <p id="pResSkills" class="whitespace-pre-line text-gray-700">HTML, CSS, JavaScript, SQL</p>
        </div>

        <div class="mb-3">
          <h2 class="font-bold border-b border-gray-400 mb-1 text-gray-800 uppercase">Experience / Projects</h2>
          <p id="pResExp" class="whitespace-pre-line text-gray-700">Detail your primary achievements and roles here...</p>
        </div>

        <div id="resWatermark" class="mt-6 text-center text-[10px] text-gray-400 font-bold border-t pt-2">CREATED ON QUICKDOCS.IN</div>
      </div>
    </div>
  </div>

  <script>
    function updateResume() {
      document.getElementById('pResName').innerText = document.getElementById('resName').value || 'YOUR NAME';
      document.getElementById('pResTitle').innerText = document.getElementById('resTitle').value || 'Target Job Title';
      document.getElementById('pResEmail').innerText = document.getElementById('resEmail').value || 'email@example.com';
      document.getElementById('pResPhone').innerText = document.getElementById('resPhone').value || '+91 9876543210';
      document.getElementById('pResSkills').innerText = document.getElementById('resSkills').value || 'HTML, CSS, JavaScript, SQL';
      document.getElementById('pResExp').innerText = document.getElementById('resExp').value || 'Detail your primary achievements and roles here...';
    }
    function downloadResume(isPaid) {
      document.getElementById('resWatermark').style.display = isPaid ? 'none' : 'block';
      html2pdf().set({ margin: 0.4, filename: 'ATS_Resume.pdf', html2canvas: { scale: 2 } }).from(document.getElementById('resumeTemplate')).save();
    }
    function triggerPayment() { alert("Razorpay Modal Opens for ₹29 payment."); }
  </script>
</body>
</html>
